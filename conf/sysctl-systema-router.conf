# PC-Router: forwarding + выход из kernel hang через panic→reboot.
# Ставится в /etc/sysctl.d/99-systema-router.conf (upgrade/install).

net.ipv4.ip_forward = 1

# Lockup/hung task → panic (иначе машина может висеть с индикацией питания).
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.hung_task_panic = 1
kernel.panic_on_oops = 1

# После panic — автоматический reboot через N секунд (не вечный ступор).
kernel.panic = 10
