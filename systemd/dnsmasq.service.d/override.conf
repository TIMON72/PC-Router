[Unit]
Description=dnsmasq - DHCP for camera LAN
After=network-pre.target systemd-networkd.service
Wants=systemd-networkd.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3s
Environment=SYSTEMA_ROUTER_ROOT=/home/admin/PC-Router
EnvironmentFile=-/home/admin/PC-Router/config.env
ExecStartPre=/home/admin/PC-Router/scripts/wait-enp4s0-camera-lan.sh
